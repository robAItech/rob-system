[pytest]
pythonpath = . repos/gbrain repos/loopx repos/gstack repos/gbrain-evals repos/hermes-agent repos/graphify sdk
testpaths = tests actions sdk/tests
python_files = test_*.py
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning:anyio.*
    ignore::DeprecationWarning:asyncio.*
    ignore::DeprecationWarning:starlette.*
    ignore::PendingDeprecationWarning:starlette.*
