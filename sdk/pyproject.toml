[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-security-sdk"
version = "0.1.0"
description = "Robot Fleet Security — OEM embed SDK (dependency-free client)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }

[tool.setuptools]
packages = ["fleet_security_sdk"]
