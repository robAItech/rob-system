<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rob AI Studio · Kontrolni prostor</title>

  <style>
    /* ================================================================
       AMBIENT 2026 — topel, temen, organski nadzor
       Brez neon mreže: globoko toplo ozadje, mehek sij, živi utrip.
       ================================================================ */
    :root {
      --bg: #100d0a;            /* skoraj čokoladno črna */
      --bg-2: #171309;          /* globinski sij */
      --panel: rgba(32,25,18,0.55);
      --panel-solid: #201912;
      --edge: rgba(233,211,170,0.12);
      --edge-soft: rgba(233,211,170,0.07);
      --ink: #f2ead9;           /* primarni tekst — toplo svetel */
      --ink-2: #b8ab96;         /* sekundarni */
      --ink-3: #7d715e;         /* utišan */
      --gold: #d9a45c;          /* akcent — soft-gold */
      --gold-soft: rgba(217,164,92,0.14);

      /* status (validirane stopnje statusne palete) */
      --good: #0ca30c;
      --good-ink: #63c463;
      --critical: #d03b3b;
      --critical-ink: #e07a6a;
      --warn: #c98500;
      --warn-ink: #e0b36a;

      --font: system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, monospace;
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(1200px 800px at 50% -10%, rgba(217,164,92,0.10), transparent 60%),
        radial-gradient(900px 700px at 85% 110%, rgba(120,90,50,0.10), transparent 60%),
        var(--bg);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    .mono { font-family: var(--mono); }

    .wrap { max-width: 1160px; margin: 0 auto; padding: 26px 22px 60px; }

    /* ---------------- header ---------------- */
    header { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 30px; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .mark {
      width: 40px; height: 40px; border-radius: 12px; flex: none;
      background: linear-gradient(150deg, rgba(217,164,92,0.25), rgba(217,164,92,0.05));
      border: 1px solid var(--edge);
      display: grid; place-items: center;
      font-family: var(--mono); font-weight: 800; font-size: 17px; color: var(--gold);
      box-shadow: 0 0 30px rgba(217,164,92,0.14);
    }
    .brand-title { font-size: 13.5px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; }
    .brand-sub { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.14em; margin-top: 2px; }

    .status-pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 7px 14px; border-radius: 999px; border: 1px solid var(--edge);
      background: var(--panel); font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--ink-2);
    }
    .status-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
    .status-pill .dot.live { background: var(--good); box-shadow: 0 0 12px var(--good); animation: breathe 2.6s ease-in-out infinite; }
    .status-pill .dot.offline { background: var(--ink-3); }
    .status-pill.live { color: var(--good-ink); border-color: color-mix(in srgb, var(--good) 35%, transparent); }
    .status-pill.offline { color: var(--ink-3); }

    /* ---------------- panel ---------------- */
    .panel {
      background: var(--panel);
      border: 1px solid var(--edge);
      border-radius: var(--radius);
      padding: 24px 26px;
      backdrop-filter: blur(8px);
    }

    /* ---------------- hero: sistemski utrip ---------------- */
    .hero {
      display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.15fr); gap: 26px;
      align-items: stretch; margin-bottom: 26px;
    }
    @media (max-width: 820px) { .hero { grid-template-columns: 1fr; } }

    .pulse-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
    .pulse {
      width: 190px; height: 190px; border-radius: 50%;
      position: relative;
      display: grid; place-items: center;
      background:
        radial-gradient(circle at 38% 32%, rgba(255,255,255,0.10), transparent 45%),
        radial-gradient(circle, color-mix(in srgb, var(--pulse-c, var(--good)) 30%, transparent), transparent 65%);
      border: 1px solid color-mix(in srgb, var(--pulse-c, var(--good)) 45%, transparent);
    }
    .pulse::before, .pulse::after {
      content: ''; position: absolute; inset: 0; border-radius: 50%;
      border: 1px solid color-mix(in srgb, var(--pulse-c, var(--good)) 28%, transparent);
    }
    .pulse::before { animation: ring 3.6s ease-out infinite; }
    .pulse::after { animation: ring 3.6s ease-out 1.8s infinite; }
    .pulse-core {
      width: 118px; height: 118px; border-radius: 50%;
      background: radial-gradient(circle at 40% 34%, color-mix(in srgb, var(--pulse-c, var(--good)) 60%, #fff 8%), color-mix(in srgb, var(--pulse-c, var(--good)) 25%, transparent));
      box-shadow: 0 0 90px color-mix(in srgb, var(--pulse-c, var(--good)) 45%, transparent);
      animation: breathe 3.4s ease-in-out infinite;
    }
    .pulse-state { font-size: 26px; font-weight: 650; letter-spacing: 0.05em; }
    .pulse-sub { font-family: var(--mono); font-size: 12px; color: var(--ink-2); letter-spacing: 0.14em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
    .pulse-sub b { color: var(--ink); font-weight: 600; }

    /* ---------------- "zdaj" pas ---------------- */
    .now {
      display: flex; align-items: center; gap: 14px;
      border: 1px solid var(--edge-soft); border-radius: 12px;
      padding: 14px 18px; background: rgba(0,0,0,0.16); margin-bottom: 26px;
    }
    .now-ico { color: var(--gold); font-size: 18px; flex: none; }
    .now-body { min-width: 0; flex: 1; }
    .now-task { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .now-meta { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.1em; margin-top: 3px; text-transform: uppercase; }
    .now-empty { color: var(--ink-3); font-size: 13px; }

    /* ---------------- vizualizaciji ---------------- */
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin-bottom: 26px; }
    @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
    .viz-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
    .viz-title { font-size: 11.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); }
    .viz-note { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.1em; }

    .chart { position: relative; width: 100%; }
    .chart svg { display: block; width: 100%; height: auto; }
    .gridline { stroke: var(--edge-soft); stroke-width: 1; }
    .axis-text { font-family: var(--mono); font-size: 10px; fill: var(--ink-3); }
    .trend-line { stroke: var(--gold); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
    .trend-area { fill: var(--gold-soft); }
    .trend-dot { fill: var(--gold); }

    .trail { display: flex; align-items: flex-end; gap: 7px; height: 92px; }
    .trail-col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; }
    .trail-shaft { width: 100%; height: 52px; border-radius: 6px; position: relative; }
    /* pikica po statusu — statusni pomen + ikona (pravilo status tokenov) */
    .trail-dot {
      width: 15px; height: 15px; border-radius: 50%;
      position: absolute; left: 50%; transform: translateX(-50%);
      border: 2px solid var(--panel-solid);
    }
    .t-complete .trail-dot { background: var(--good); box-shadow: 0 0 10px rgba(12,163,12,0.35); }
    .t-running  .trail-dot { background: var(--warn); box-shadow: 0 0 10px rgba(201,133,0,0.4); animation: breathe 1.6s ease-in-out infinite; }
    .t-failed   .trail-dot { background: var(--critical); box-shadow: 0 0 10px rgba(208,59,59,0.4); }
    .trail-id { font-family: var(--mono); font-size: 9.5px; color: var(--ink-3); }

    .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-2); letter-spacing: 0.06em; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .lg-good i { background: var(--good); } .lg-warn i { background: var(--warn); } .lg-critical i { background: var(--critical); }

    /* ---------------- naloge ---------------- */
    .runs-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .runs-title { font-size: 11.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); }
    .runs-count { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.1em; }

    .run-row {
      display: flex; align-items: center; gap: 14px; width: 100%;
      padding: 13px 16px; border-radius: 12px;
      border: 1px solid var(--edge-soft); background: rgba(0,0,0,0.14);
      color: var(--ink); text-align: left; cursor: pointer;
      transition: border-color .18s, background .18s; margin-bottom: 8px;
    }
    .run-row:hover { border-color: var(--edge); background: rgba(217,164,92,0.05); }
    .run-row .rd { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    .run-row .rd.complete { background: var(--good); box-shadow: 0 0 8px rgba(12,163,12,0.4); }
    .run-row .rd.running { background: var(--warn); box-shadow: 0 0 8px rgba(201,133,0,0.5); animation: breathe 1.5s infinite; }
    .run-row .rd.failed { background: var(--critical); box-shadow: 0 0 8px rgba(208,59,59,0.5); }
    .run-task { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .run-meta { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.06em; white-space: nowrap; }
    .run-meta b { color: var(--ink-2); font-weight: 600; }
    .run-empty { color: var(--ink-3); font-size: 13px; padding: 6px 2px; }

    /* ---------------- vnos ---------------- */
    .prompt { display: flex; gap: 12px; margin: 26px 0; }
    .prompt input {
      flex: 1; padding: 15px 18px; border-radius: 12px;
      background: rgba(0,0,0,0.24); border: 1px solid var(--edge);
      color: var(--ink); font-size: 14px; font-family: var(--font);
      outline: none; transition: border-color .18s;
    }
    .prompt input::placeholder { color: var(--ink-3); }
    .prompt input:focus { border-color: color-mix(in srgb, var(--gold) 55%, transparent); }
    .prompt button {
      padding: 15px 26px; border-radius: 12px; cursor: pointer;
      background: linear-gradient(150deg, #e2b06a, #c89250); color: #1c150b;
      font-size: 13.5px; font-weight: 700; letter-spacing: 0.06em; border: none; white-space: nowrap;
      transition: filter .18s, transform .12s;
    }
    .prompt button:hover { filter: brightness(1.06); }
    .prompt button:active { transform: translateY(1px); }
    .prompt button:disabled { opacity: .6; cursor: wait; }

    /* ---------------- footer ---------------- */
    footer { display: flex; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--edge-soft); }
    .foot-k { font-family: var(--mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.14em; text-transform: uppercase; }
    .foot-v { font-size: 17px; font-weight: 600; margin-top: 3px; }
    .offline-note { color: var(--critical-ink); font-size: 12px; margin-top: 18px; text-align: center; font-family: var(--mono); letter-spacing: 0.06em; }

    /* ---------------- modal ---------------- */
    .overlay { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.55); backdrop-filter: blur(4px); padding: 20px; }
    .modal { width: 100%; max-width: 560px; background: var(--panel-solid); border: 1px solid var(--edge); border-radius: var(--radius); padding: 26px; box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
    .modal h3 { margin: 0 0 4px; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
    .modal .modal-task { font-size: 14px; font-weight: 600; margin-bottom: 18px; word-wrap: break-word; }
    .modal .close { position: absolute; top: -9999px; }
    .modal .art {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px 14px; border-radius: 10px; border: 1px solid var(--edge-soft);
      background: rgba(0,0,0,0.14); margin-bottom: 8px;
    }
    .modal .art-name { font-size: 13px; font-weight: 500; }
    .modal .art-path { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
    .modal .art-actions { display: flex; gap: 8px; flex: none; }
    .btn { padding: 8px 12px; border-radius: 9px; border: 1px solid var(--edge); background: rgba(217,164,92,0.08); color: var(--gold); cursor: pointer; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; }
    .btn:hover { background: rgba(217,164,92,0.16); }
    .btn-ghost { background: transparent; color: var(--ink-2); border-color: var(--edge); }
    .btn-ghost:hover { background: rgba(255,255,255,0.03); color: var(--ink); }

    @keyframes breathe { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.12); opacity: .55; } }
    @keyframes ring { 0% { transform: scale(1); opacity: .5; } 100% { transform: scale(1.55); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .pulse-core, .pulse::before, .pulse::after, .status-pill .dot.live, .trail-dot, .run-row .rd.running { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- Header -->
    <header>
      <div class="brand">
        <div class="mark">R</div>
        <div>
          <div class="brand-title">Kontrolni prostor</div>
          <div class="brand-sub">Rob AI Studio</div>
        </div>
      </div>
      <div id="statusPill" class="status-pill offline"><span class="dot"></span><span id="statusText">Offline</span><span id="providerTxt" class="brand-sub" style="text-transform:none"></span></div>
    </header>

    <!-- Hero: sistemski utrip -->
    <div class="hero">
      <div class="panel pulse-wrap">
        <div class="pulse" id="pulse">
          <div class="pulse-core" id="pulseCore"></div>
        </div>
        <div style="text-align:center">
          <div class="pulse-state" id="pulseState">Pripravljen</div>
          <div class="pulse-sub">v teku <b id="runningCount">0</b></div>
        </div>
      </div>

      <div class="panel" style="display:flex;flex-direction:column">
        <div class="viz-head">
          <span class="viz-title">Pretok</span>
          <span class="viz-note">poraba tekov · µ$</span>
        </div>
        <div class="chart" id="trendChart" style="flex:1;min-height:200px"></div>
      </div>
    </div>

    <!-- "Zdaj" pas -->
    <div class="now">
      <div class="now-ico" id="nowIco">◦</div>
      <div class="now-body">
        <div class="now-task" id="nowTask">Ni bilo dejavnosti.</div>
        <div class="now-meta" id="nowMeta">diagnostika sistema</div>
      </div>
    </div>

    <!-- Vizualizacija: statusi tekov -->
    <div class="panel" style="margin-bottom:26px">
      <div class="viz-head">
        <span class="viz-title">Zadnji teki</span>
        <span class="viz-note">status · od starejšega do novejšega</span>
      </div>
      <div class="trail" id="trail"></div>
      <div class="legend">
        <span class="lg-good"><i></i>zeleno</span>
        <span class="lg-warn"><i></i>teče</span>
        <span class="lg-critical"><i></i>napaka</span>
      </div>
    </div>

    <!-- Naloge -->
    <div class="panel">
      <div class="runs-head">
        <span class="runs-title">Naloge</span>
        <span class="runs-count" id="runsCount">—</span>
      </div>
      <div id="runList"></div>
    </div>

    <!-- Vnos nove naloge -->
    <div class="prompt">
      <input id="taskInput" type="text" placeholder="Nova naloga v orkestrator … npr. pripravi analizo trga" />
      <button id="runBtn">Zaženi</button>
    </div>

    <footer>
      <div><div class="foot-k">dogodki</div><div class="foot-v" id="evCount">—</div></div>
      <div><div class="foot-k">porabljen proračun</div><div class="foot-v" id="budgetVal">—</div></div>
      <div style="flex:1"></div>
      <div style="text-align:right"><div class="foot-k">sistem</div><div class="foot-v" id="systemVal">—</div></div>
    </footer>

    <div id="offlineNote" class="offline-note" style="display:none">Server ni dosegljiv — prikazujem lokalni posnetek.</div>

  </div>

  <!-- Modal -->
  <div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  </div>

  <script>
    'use strict';

    // =====================================================================
    //  API sloj — enak kontrakt kot src/server.ts (Ni spreminjan serverja.)
    //  /api/health · /api/ledger · /api/runs · /api/artifact · POST /api/run
    // =====================================================================
    const API = { health:'/api/health', ledger:'/api/ledger', runs:'/api/runs' };

    let offline = false;
    let ledgerData = [];
    let apiRuns = [];
    let healthData = null;
    let tick = 0;             // za ambientno gibanje orb
    const POLL_MS = 3000;

    async function api(path, opts) {
      const res = await fetch(path, opts);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }

    // =====================================================================
    //  Mock fallback (razvoj) — enak oblikovni jezik kot live
    // =====================================================================
    const SEED = [
      { k:'task.submitted', a:'USER', n:'Izvedi diagnozo reaktorja' },
      { k:'decision.made',  a:'PLANNER', n:'pot: zagon diagnostičnega toka' },
      { k:'llm.responded',  a:'RUNNER', n:'ollama · 1 240 žetonov' },
      { k:'artifact.written',a:'BUILDER', n:'out/diagnostics-v1.md' },
      { k:'run.completed',  a:'RUNNER', n:'vsi koraki doseženi' },
      { k:'llm.failed',     a:'RUNNER', n:'ENETWORK · timeout' },
      { k:'run.stuck',      a:'RUNNER', n:'preverjanje ni uspelo' },
      { k:'task.submitted', a:'USER', n:'Izdelaj vmesnik API' },
      { k:'artifact.written',a:'BUILDER', n:'out/vmesnik.md' },
      { k:'run.completed',  a:'RUNNER', n:'vsi koraki doseženi' },
    ];
    const mockRuns = [
      { id:'m-run-4', status:'running',   spendMicros: 405 },
      { id:'m-run-1', status:'completed', spendMicros: 1840 },
      { id:'m-run-2', status:'failed',    spendMicros: 2560 },
      { id:'m-run-3', status:'completed', spendMicros: 1320 },
    ];

    // =====================================================================
    //  Nalaganje + live polling
    // =====================================================================
    async function loadAll() {
      try {
        const [h, l, r] = await Promise.all([ api(API.health), api(API.ledger), api(API.runs) ]);
        healthData = h; ledgerData = l.events || []; apiRuns = r.runs || [];
        setOffline(false);
      } catch {
        // ambientni offline: orb zaspi, mock je samo dehren razvojni posnetek
        healthData = { llmOnline:false, provider:'—', eventCount:SEED.length, runCount:mockRuns.length, budgetMicros: 6125 };
        ledgerData = SEED.map((e,i) => ({ runId:'mock', runSeq:i+1, kind:e.k, actor:e.a, causedByRunSeq:i, ts:null, payload:{ task:e.n } }));
        apiRuns = mockRuns;
        setOffline(true);
      }
      renderAll();
    }

    function setOffline(v) {
      offline = v;
      const pill = document.getElementById('statusPill');
      const txt = document.getElementById('statusText');
      const dot = pill.querySelector('.dot');
      const note = document.getElementById('offlineNote');
      if (v) {
        pill.className = 'status-pill offline'; dot.className = 'dot offline';
        txt.textContent = 'Offline'; note.style.display = 'block';
      } else {
        pill.className = 'status-pill live'; dot.className = 'dot live';
        txt.textContent = 'Live'; note.style.display = 'none';
      }
      document.getElementById('providerTxt').textContent = healthData?.provider ? '· ' + healthData.provider : '';
    }

    // =====================================================================
    //  Render vsega
    // =====================================================================
    function renderAll() {
      renderPulse();
      renderNow();
      renderTrail();
      renderRuns();
      renderFooter();
      renderTrend();
    }

    // ----- sistemski utrip (hero) -----
    // Stetje statusa: running>0 → DELAM(gold); zadnji tick failed/stuck → UJETO(critical);
    // sicer MIRNO(good).
    function systemState() {
      const running = (apiRuns||[]).filter(r => r.status === 'running').length;
      const last = (apiRuns||[]).slice().reverse().find(r => r.status !== 'running');
      return { running, last };
    }

    function renderPulse() {
      const { running, last } = systemState();
      const pulse = document.getElementById('pulse');
      const core = document.getElementById('pulseCore');
      document.getElementById('runningCount').textContent = running;

      let c, label;
      if (running > 0) { c = 'var(--warn)'; label = 'Delam'; }
      else if (last && (last.status === 'failed' || last.status === 'stuck')) { c = 'var(--critical)'; label = 'Ujeto'; }
      else { c = 'var(--good)'; label = 'Mirno'; }

      pulse.style.setProperty('--pulse-c', c);
      core.style.animationDuration = '0s'; void core.offsetWidth;
      core.style.animationDuration = running>0 ? '1.7s' : (last && last.status==='running' ? '1.7s' : '3.4s');
      document.getElementById('pulseState').textContent = label;
      document.getElementById('pulseState').style.color = label==='Ujeto' ? 'var(--critical-ink)' : (label==='Delam' ? 'var(--warn-ink)' : 'var(--good-ink)');
    }

    // ----- "zdaj" pas -----
    function renderNow() {
      const running = (apiRuns||[]).filter(r => r.status === 'running');
      const elTask = document.getElementById('nowTask');
      const elMeta = document.getElementById('nowMeta');
      if (running.length) {
        const e = findEventForRun(running[0].id, 'task.submitted');
        const name = e?.payload?.task || running[0].id.slice(0, 8);
        elTask.textContent = name;
        elMeta.textContent = 'tek #' + running[0].id.slice(0,8) + ' · v izvajanju';
      } else if ((apiRuns||[]).length) {
        const last = (apiRuns||[])[0];   // apiRuns že najnovejši prvi
        elTask.textContent = 'Nazadnje: ' + (findEventForRun(last.id,'task.submitted')?.payload?.task || last.id.slice(0,8));
        elMeta.textContent = statusWord(last.status);
      } else {
        elTask.textContent = 'Ni bilo dejavnosti.';
        elMeta.textContent = 'pripravljeno';
      }
    }

    function findEventForRun(runId, kind) {
      return (ledgerData||[]).find(e => e.runId === runId && e.kind === kind);
    }
    function statusWord(s) { return s==='completed'?'zaključeno':s==='running'?'teče':s==='failed'?'napaka':s==='stuck'?'obstalo':(s||'—'); }

    // ----- trail: zadnji statusi tekov (s časovnico) -----
    function renderTrail() {
      const el = document.getElementById('trail');
      const runs = (apiRuns||[]).slice(0, 10).reverse(); // najstarejši → najnovejši (levo→desno)
      if (!runs.length) { el.innerHTML = '<div class="run-empty">Brez tekov.</div>'; return; }
      el.innerHTML = runs.map(r => `
        <div class="trail-col t-${statusKey(r.status)}">
          <div class="trail-shaft"><span class="trail-dot" title="${statusWord(r.status)} — ${r.id.slice(0,8)}"></span></div>
          <span class="trail-id">${r.id.slice(0,4)}</span>
        </div>`).join('');
    }
    function statusKey(s) {
      if (s === 'running') return 'running';
      if (s === 'failed' || s === 'stuck' || s === 'aborted') return 'failed';
      return 'complete';
    }

    // ----- naloge -----
    function renderRuns() {
      const list = document.getElementById('runList');
      const runs = (apiRuns||[]);
      document.getElementById('runsCount').textContent = runs.length + ' tekov';

      if (!runs.length) { list.innerHTML = '<div class="run-empty">Brez izvedenih nalog.</div>'; return; }

      list.innerHTML = runs.map(r => {
        const e = findEventForRun(r.id, 'task.submitted');
        const task = e?.payload?.task || r.id.slice(0, 24);
        const spend = (r.spendMicros||0) / 1000000;
        return `
          <button class="run-row" onclick="openModal('${cssEsc(r.id)}')">
            <span class="rd ${statusKey(r.status)}"></span>
            <span class="run-task">${esc(task)}</span>
            <span class="run-meta">${statusWord(r.status)} · $<b>${spend.toFixed(4)}</b></span>
          </button>`;
      }).join('');
    }

    // ----- footer -----
    function renderFooter() {
      document.getElementById('evCount').textContent = healthData?.eventCount ?? (ledgerData||[]).length;
      const bMicros = healthData?.budgetMicros ?? 0;
      document.getElementById('budgetVal').textContent = bMicros > 0 ? '$' + (bMicros/1000000).toFixed(4) : '—';
      document.getElementById('systemVal').textContent = offline ? 'offline' : ('online' + (healthData?.llmOnline ? ' · llm' : ''));
    }

    // ----- trend porabe (mehka linija + polnilo, 1 serija) -----
    function renderTrend() {
      const box = document.getElementById('trendChart');
      const runs = (apiRuns||[]).slice(0, 14);   // najnovejši prvi
      const W = 560, H = 190, P = 14;
      const vals = runs.map(r => r.spendMicros || 0).reverse();
      if (!vals.length) { box.innerHTML = '<div class="run-empty">Brez porabe.</div>'; return; }

      // Obramba pred deljenjem z nič: če ni zabeležene porabe (spend 0),
      // prikažemo raven nivo namesto NaN.
      const rawMax = Math.max.apply(null, vals);
      const max = rawMax > 0 ? rawMax * 1.12 : 1;
      const n = vals.length;
      const x = i => (n === 1) ? P : P + i * (W - 2*P) / (n - 1);
      const y = v => H - P - (v / max) * (H - 2*P);

      let pts = vals.map((v,i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
      let area = `M${P},${H-P} L` + pts.join(' L') + ` L${x(n-1).toFixed(1)},${H-P}`;

      // oznake na osi (po števci)
      let ticks = '';
      for (let v = 0; v < max; v += max/4) {
        const yy = y(v);
        ticks += `<line class="gridline" x1="${P}" y1="${yy}" x2="${W-P}" y2="${yy}"/>`;
      }

      box.innerHTML = `
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:212px">
          ${ticks}
          <path class="trend-area" d="${area}"/>
          <polyline class="trend-line" points="${pts.join(' ')}"/>
          ${vals.map((v,i)=>`<circle class="trend-dot" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.5"/>`).join('')}
        </svg>`;
    }

    // =====================================================================
    //  Akcije: nova naloga, modal, artefakti
    // =====================================================================
    async function runTask() {
      const input = document.getElementById('taskInput');
      const task = (input.value||'').trim();
      if (!task) return;
      const btn = document.getElementById('runBtn');
      const prev = btn.textContent;
      btn.disabled = true; btn.textContent = 'Teče …';
      try {
        if (offline) {
          ledgerData.push({ runId:'mock', runSeq:ledgerData.length+1, kind:'task.submitted', actor:'USER', causedByRunSeq:ledgerData.length, ts:null, payload:{ task } });
          apiRuns.push({ id:'m-run-'+Date.now().toString(36), status:'running', spendMicros: 300 });
          await new Promise(r => setTimeout(r, 700));
          apiRuns[apiRuns.length-1].status = 'completed';
          renderAll();
        } else {
          const res = await api('/api/run', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ task, kind:'dashboard' }) });
          await loadAll();
          if (!res.ok && res.error) throw new Error(res.error);
        }
      } catch (err) {
        console.error('[dashboard] napaka pri zagonu:', err);
      } finally {
        btn.disabled = false; btn.textContent = prev;
        input.value = '';
      }
    }

    async function openModal(runId) {
      let artifacts = [];
      try {
        const events = (ledgerData||[]).filter(e => e.runId === runId && e.kind === 'artifact.written' && e.payload?.path);
        artifacts = [...new Set(events.map(e => e.payload.path))];
      } catch {}
      const taskEv = findEventForRun(runId, 'task.submitted');
      const task = taskEv?.payload?.task || runId.slice(0,24);

      const ov = document.getElementById('overlay');
      ov.innerHTML = `
        <div class="modal">
          <h3>Artefakti naloge</h3>
          <div class="modal-task">${esc(task)}</div>
          <div class="mono" style="font-size:10.5px;color:var(--ink-3);margin-bottom:14px">#${esc(runId)}</div>
          ${artifacts.length === 0
            ? '<div class="run-empty">Ta tek ni ustvaril artefaktov.</div>'
            : artifacts.map(p => `
                <div class="art">
                  <div>
                    <div class="art-name">${esc(p.split('/').pop())}</div>
                    <div class="art-path">${esc(p)}</div>
                  </div>
                  <div class="art-actions">
                    <button class="btn" onclick="viewArtifact('${cssEsc(p)}')">Odpri</button>
                    <button class="btn btn-ghost" onclick="downloadArtifact('${cssEsc(p)}')">⤓</button>
                  </div>
                </div>`).join('')}
          <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px">
            <button class="btn btn-ghost" onclick="closeModal()">Zapri</button>
          </div>
        </div>`;
      ov.style.display = 'flex';
    }

    function closeModal() { document.getElementById('overlay').style.display = 'none'; document.getElementById('overlay').innerHTML=''; }
    function viewArtifact(p)   { window.open('/api/artifact?path=' + encodeURIComponent(p) + '&view=1', '_blank'); }
    function downloadArtifact(p) {
      const a = document.createElement('a');
      a.href = '/api/artifact?path=' + encodeURIComponent(p);
      a.download = p.split('/').pop() || 'datoteka';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    // =====================================================================
    //  Pomožne
    // =====================================================================
    function esc(s) { return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function cssEsc(s) { return String(s??'').replace(/[\\"']/g, '\\$&'); }

    // =====================================================================
    //  Init
    // =====================================================================
    document.getElementById('runBtn').addEventListener('click', runTask);
    document.getElementById('taskInput').addEventListener('keydown', e => { if (e.key === 'Enter') runTask(); });

    (async () => {
      await loadAll();
      setInterval(() => loadAll(), POLL_MS);
    })();
  </script>
</body>
</html>
