name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Nočni eval avtonomnosti — 03:23 UTC (minuta 23, izogib :00/:30).
    - cron: '23 3 * * *'
  workflow_dispatch:

jobs:
  ci:
    name: PR gate (tests + eval dry-run)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run test suite
        run: python -m pytest tests/ -q
      - name: P5 eval dry-run (structural, no LLM)
        run: python evaluate_autonomy.py --dry-run

  eval-nightly:
    name: P5 eval nightly (full scale, real LLM + Docker)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build RSI sandbox image
        run: docker build -f Dockerfile.sandbox -t rob-sandbox .
      - name: Guard — API key mora biti nastavljen
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ] || [ "$DEEPSEEK_API_KEY" = "sk-your-deepseek-api-key-here" ]; then
            echo "::error::DEEPSEEK_API_KEY secret ni nastavljen — nočni eval bi dal lažno zeleno."
            exit 1
          fi
      - name: Run full autonomy eval
        id: eval
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python evaluate_autonomy.py --report .rob_ai/eval_report.md
        timeout-minutes: 300
      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-eval-history
          path: |
            .rob_ai/eval_history.json
            .rob_ai/eval_report.md
