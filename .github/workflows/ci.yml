name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Nočni eval avtonomnosti — 1× tedensko, sobota zjutraj 03:23 UTC
    # (vikend = nizke cene tokenov; minuta 23, izogib :00/:30).
    - cron: '23 3 * * 6'
  workflow_dispatch:

jobs:
  ci:
    name: PR gate (tests + eval dry-run)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run test suite
        run: python -m pytest tests/ -q
      - name: P5 eval dry-run (structural, no LLM)
        run: python evaluate_autonomy.py --dry-run
      - name: Setup bun (dashboard server)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install bun dependencies
        run: bun install --frozen-lockfile
      - name: Smoke test dashboard server
        run: bash scripts/smoke_server.sh

  eval-nightly:
    name: P5 eval nightly (full scale, real LLM + Docker)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build RSI sandbox image
        run: docker build -f Dockerfile.sandbox -t rob-sandbox .
      # Nočni eval: brez veljavnega DEEPSEEK_API_KEY secret-a se korak uspešno
      # zaključi (job ne pade, CI ni rdeč). Z ključem požene eval. Uporaba
      # secrets v `run` (ne `if:` — `secrets` v `if` GitHubov parser zavrne).
      - name: Run full autonomy eval
        id: eval
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ] || [ "$DEEPSEEK_API_KEY" = "sk-your-deepseek-api-key-here" ]; then
            echo "::warning::DEEPSEEK_API_KEY secret ni nastavljen — nočni eval preskočen (nastavi: gh secret set DEEPSEEK_API_KEY)"
            exit 0
          fi
          python evaluate_autonomy.py --report .rob_ai/eval_report.md
        timeout-minutes: 300
      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-eval-history
          path: |
            .rob_ai/eval_history.json
            .rob_ai/eval_report.md
