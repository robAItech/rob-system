robert:
  name: Robert Slavec
  role: Arhitekt humanoidne robotike / embodied AI (Plan-net Robot, Pariz)
  background_short: Unitree G1/H1, NVIDIA Jetson Orin, voice/embodied AI, YC Startup School 2017
  languages: [slovenščina, angleščina, b/h/s]
  author_credit: "Robert Slavec — avtor v vsej kodi"
  style_note: "Jedrnato, konkretno, v slovenščini. Brez olepševanja."

ventures:
  rob_system:
    name: ROB System
    why: "Avtonomno AI podjetje (Company-as-Code). Edini posel (potrjeno 2026-09-02). Področje, kjer chief prvi teden vadi."
    status: active
    focus: "Prvi teden: chief se uči na ROB Systemu — zaprt krog poročilo → Robertov popravek → učenje. Jedro (daemon/orchestrator/agenda) zaklenjeno."
    next_action: "Zapelji prvi teden: dnevno `python -m chief --report`, Robert popravi, popravek shrani kot učni signal; po 7 dneh oceni, ali so bile izbire prave, šele nato odpri več avtonomije (roke / daemon beat)."

style_guardrails:
  tone: "Jedrnato, konkretno, v slovenščini; brez olepševanja in hype."
